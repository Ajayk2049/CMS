syntax = "proto3";

package device;

service DeviceService {
  rpc RegisterDevice (RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc TrackAdImpression (AdImpressionRequest) returns (AdImpressionResponse);
  rpc BatchTrackAdImpressions (BatchAdImpressionRequest) returns (AdImpressionResponse);
}

message RegisterDeviceRequest {
  string deviceId = 1;
  string deviceType = 2; // tablet, screen
  string hostApplicationId = 3;
}

message RegisterDeviceResponse {
  bool success = 1;
  string message = 2;
  string status = 3; // online, offline
}

message HeartbeatRequest {
  string deviceId = 1;
  bool callWaiter = 2;
  string waiterOption = 3;
  string tableNumber = 4;
}

message HeartbeatResponse {
  bool success = 1;
  string command = 2; // e.g. reload, reboot, normal
  string tableSessionJson = 3; // JSON: {"status":"close_table|completed","orderId":"...","amount":45000,"upiUrl":"upi://pay?...","tableNumber":"..."}
}

message AdImpressionRequest {
  string deviceId = 1;
  string bookingId = 2;
  int32 durationSeconds = 3;
  int32 interactiveClicks = 4; // tablet only
}

message AdImpressionResponse {
  bool success = 1;
  string message = 2;
}

message BatchAdImpressionRequest {
  repeated AdImpressionRequest impressions = 1;
}
